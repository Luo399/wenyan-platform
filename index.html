<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="文言文预习平台：课文朗读、生字注释、文化卡片与分层练习，帮助学生在课前完成文言文预习。"

      href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap"
