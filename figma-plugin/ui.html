<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文言文资源同步</title>
  <style>
    /* Figma 主题变量（由 figma.showUI themeColors 注入） */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--figma-color-bg, #1e1e1e);
      color: var(--figma-color-text, #ccc);
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--figma-color-border, #333);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--figma-color-text, #fff);
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      color: var(--figma-color-text-secondary, #888);
    }
    .config-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .config-row label {
      font-size: 12px;
      color: var(--figma-color-text-secondary, #888);
      white-space: nowrap;
    }
    .config-row input {
      flex: 1;
      padding: 6px 8px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      border: 1px solid var(--figma-color-border, #444);
      border-radius: 4px;
      color: var(--figma-color-text, #ccc);
      font-size: 12px;
      outline: none;
    }
    .config-row input:focus {
      border-color: var(--figma-color-border-brand, #18a0fb);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      border-radius: 6px;
      font-size: 12px;
    }
    .status-bar .count {
      color: var(--figma-color-text-brand, #18a0fb);
      font-weight: 600;
    }
    .status-bar .status-text {
      color: var(--figma-color-text-secondary, #888);
    }
    .assets-list {
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .assets-list::-webkit-scrollbar {
      width: 6px;
    }
    .assets-list::-webkit-scrollbar-track {
      background: var(--figma-color-bg-secondary, #2a2a2a);
    }
    .assets-list::-webkit-scrollbar-thumb {
      background: var(--figma-color-border, #555);
      border-radius: 3px;
    }
    .asset-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      cursor: default;
      transition: background 0.2s;
    }
    .asset-item:hover {
      background: var(--figma-color-bg-tertiary, #333);
    }
    .asset-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .asset-icon.image {
      background: var(--figma-color-bg-brand-tertiary, #1a3a5c);
      color: var(--figma-color-text-brand, #18a0fb);
    }
    .asset-icon.text {
      background: var(--figma-color-bg-warning-tertiary, #3a2a1a);
      color: var(--figma-color-text-warning, #f5a623);
    }
    .asset-info {
      flex: 1;
      min-width: 0;
    }
    .asset-name {
      font-size: 12px;
      color: var(--figma-color-text, #eee);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asset-path {
      font-size: 11px;
      color: var(--figma-color-text-secondary, #666);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asset-status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .asset-status.new {
      background: var(--figma-color-bg-success-tertiary, #1a3a1a);
      color: var(--figma-color-text-success, #4caf50);
    }
    .asset-status.changed {
      background: var(--figma-color-bg-warning-tertiary, #3a3a1a);
      color: var(--figma-color-text-warning, #f5a623);
    }
    .asset-status.unchanged {
      background: var(--figma-color-bg-tertiary, #2a2a2a);
      color: var(--figma-color-text-tertiary, #666);
    }
    .asset-status.uploaded {
      background: var(--figma-color-bg-success-tertiary, #1a3a1a);
      color: var(--figma-color-text-success, #4caf50);
    }
    .asset-status.error {
      background: var(--figma-color-bg-danger-tertiary, #3a1a1a);
      color: var(--figma-color-text-danger, #f44336);
    }
    .asset-size {
      font-size: 11px;
      color: var(--figma-color-text-secondary, #666);
      flex-shrink: 0;
      margin-left: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--figma-color-bg-brand, #18a0fb);
      color: var(--figma-color-text-onbrand, #fff);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--figma-color-bg-brand-hover, #0e8cd9);
    }
    .btn-secondary {
      background: var(--figma-color-bg-secondary, #333);
      color: var(--figma-color-text, #ccc);
    }
    .btn-secondary:hover {
      background: var(--figma-color-bg-tertiary, #444);
    }
    .btn-danger {
      background: var(--figma-color-bg-danger, #f44336);
      color: var(--figma-color-text-onbrand, #fff);
    }
    .summary {
      margin-top: 12px;
      padding: 12px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.8;
    }
    .summary .success { color: var(--figma-color-text-success, #4caf50); }
    .summary .warning { color: var(--figma-color-text-warning, #f5a623); }
    .summary .error-text { color: var(--figma-color-text-danger, #f44336); }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    .progress-bar {
      height: 4px;
      background: var(--figma-color-bg-tertiary, #333);
      border-radius: 2px;
      margin: 8px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--figma-color-bg-brand, #18a0fb);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--figma-color-text-tertiary, #666);
    }
    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .empty-state .message {
      font-size: 13px;
      line-height: 1.6;
    }
    .error-detail {
      margin-top: 8px;
      padding: 8px;
      background: var(--figma-color-bg-danger-tertiary, #3a1a1a);
      border-radius: 4px;
      font-size: 11px;
      color: var(--figma-color-text-danger, #f44336);
      max-height: 80px;
      overflow-y: auto;
    }
    /* ===== 页签切换（上传清单 / 资源清单） ===== */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab {
      flex: 1;
      padding: 8px 0;
      border: 1px solid var(--figma-color-border, #444);
      border-radius: 6px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      color: var(--figma-color-text-secondary, #888);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab:hover { background: var(--figma-color-bg-tertiary, #333); }
    .tab.active {
      background: var(--figma-color-bg-brand, #18a0fb);
      border-color: var(--figma-color-bg-brand, #18a0fb);
      color: var(--figma-color-text-onbrand, #fff);
    }
    /* ===== 资源清单（按课文 WEN 汇总） ===== */
    .inv-group-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--figma-color-text, #eee);
      margin: 12px 0 6px;
    }
    .inv-wen {
      border: 1px solid var(--figma-color-border, #333);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .inv-wen.inv-empty { opacity: 0.5; }
    .inv-wen summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--figma-color-bg-secondary, #2a2a2a);
      cursor: pointer;
    }
    .inv-wen summary::-webkit-details-marker { display: none; }
    .inv-wen summary:hover { background: var(--figma-color-bg-tertiary, #333); }
    .inv-wen[open] summary { background: var(--figma-color-bg-tertiary, #333); }
    .inv-wen-id {
      font-size: 11px;
      background: var(--figma-color-bg-brand-tertiary, #1a3a5c);
      color: var(--figma-color-text-brand, #18a0fb);
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .inv-wen-title { flex: 1; font-size: 12px; color: var(--figma-color-text, #eee); }
    .inv-count { font-size: 11px; color: var(--figma-color-text-secondary, #888); flex-shrink: 0; }
    .inv-body { padding: 8px 10px; border-top: 1px solid var(--figma-color-border, #222); }
    .inv-cat { margin-bottom: 8px; }
    .inv-cat:last-child { margin-bottom: 0; }
    .inv-cat-title { font-size: 11px; color: var(--figma-color-text-secondary, #999); margin-bottom: 4px; }
    .inv-files { display: flex; flex-direction: column; gap: 2px; }
    .inv-file {
      font-size: 11px;
      color: var(--figma-color-text, #ccc);
      background: var(--figma-color-bg, #222);
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .inv-file .inv-file-meta {
      margin-left: auto;
      font-size: 10px;
      color: var(--figma-color-text-tertiary, #666);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>文言文资源同步</h1>
    <p>扫描当前文件中的 Export Assets 和 文字资源_ Frame，按 Frame 命名规则同步到 OSS</p>
  </div>

  <div class="config-row">
    <label>API 地址：</label>
    <input type="text" id="apiBase" value="https://api.classicalab.cn" placeholder="后端 API 地址" />
  </div>

  <div class="config-row">
    <label>同步令牌：</label>
    <input type="password" id="apiToken" placeholder="ASSET_SYNC_TOKEN（可选，未配置时走免令牌通道）" />
  </div>

  <div class="tabs" id="tabBar">
    <button class="tab active" data-tab="upload" onclick="switchTab('upload')">上传清单</button>
    <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">资源清单</button>
  </div>

  <!-- 上传清单（当前扫描结果，用于同步） -->
  <div id="uploadView">
    <div id="statusBar" class="status-bar">
      <span class="status-text">扫描中...</span>
      <span class="count">0 个资源</span>
    </div>

    <div id="progressBar" class="progress-bar" style="display:none">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div id="assetsContainer" class="assets-list">
      <div class="empty-state">
        <div class="icon">🔍</div>
        <div class="message">正在扫描当前文件中的资源...</div>
      </div>
    </div>

    <div id="actions" class="actions" style="display:none">
      <button id="syncBtn" class="btn-primary" onclick="handleSync()">开始同步</button>
    </div>

    <div id="summary" class="summary" style="display:none"></div>
  </div>

  <!-- 资源清单（后端已上传资源的全量汇总，按课文 WEN 分组） -->
  <div id="inventoryView" style="display:none">
    <button id="inventoryLoadBtn" class="btn-secondary" onclick="loadInventory()">加载资源清单</button>
    <div id="inventoryContainer" class="assets-list" style="max-height:400px">
      <div class="empty-state">
        <div class="icon">📦</div>
        <div class="message">资源清单直读 OSS 桶【真实文件】（按课文 WEN 分组），<br>与"上传清单（version.json 声称已上传）"是不同数据源。<br>用于排查"显示上传成功、实际未上传到 OSS"的情况。<br>点击上方按钮加载。</div>
      </div>
    </div>
  </div>

  <script>
    // 网络请求超时时间（毫秒）
    var FETCH_TIMEOUT_MS = 30000

    var assets = []
    var isSyncing = false

    // 接收来自主线程的消息（使用 onmessage 而非 window.onmessage，符合官方规范）
    onmessage = function(event) {
      var msg = event.data.pluginMessage || event.data

      switch (msg.type) {
        case 'scan-result':
          assets = msg.assets
          renderAssets(msg.assets)
          updateStatus(msg.assets.length)
          document.getElementById('actions').style.display = 'flex'
          break

        case 'no-assets':
          document.getElementById('assetsContainer').innerHTML =
            '<div class="empty-state">' +
              '<div class="icon">📭</div>' +
              '<div class="message">' + escapeHtml(msg.message) + '</div>' +
              '<div class="message" style="margin-top:12px;color:var(--figma-color-text-secondary,#888)">' +
                '以上不符会导致扫描不到资源，请排查后重新运行插件。' +
              '</div>' +
            '</div>'
          updateStatus(0)
          break

        case 'sync-start':
          isSyncing = true
          document.getElementById('syncBtn').disabled = true
          document.getElementById('progressBar').style.display = 'block'
          document.getElementById('summary').style.display = 'none'
          updateStatus(msg.total, '导出中...')
          break

        case 'sync-data':
          // 主线程已导出图片节点，UI 线程负责上传（支持 FormData）
          updateStatus(msg.assets.length, '上传中...')
          uploadAssets(msg.apiBase, msg.apiToken, msg.assets)
          break

        case 'sync-complete':
          isSyncing = false
          document.getElementById('syncBtn').disabled = false
          document.getElementById('progressBar').style.display = 'none'
          document.getElementById('actions').style.display = 'none'
          showSummary(msg.summary, msg.results)
          renderResults(msg.results)
          break

        case 'sync-error':
          isSyncing = false
          document.getElementById('syncBtn').disabled = false
          document.getElementById('progressBar').style.display = 'none'
          showError(msg.error)
          break

        case 'scan-error':
          document.getElementById('assetsContainer').innerHTML =
            '<div class="empty-state">' +
              '<div class="icon">❌</div>' +
              '<div class="message">扫描失败：' + escapeHtml(msg.error) + '</div>' +
            '</div>'
          break
      }
    }

    /** 转义 HTML 特殊字符，防止 XSS */
    function escapeHtml(str) {
      if (typeof str !== 'string') return String(str)
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
    }

    function renderAssets(assets) {
      var container = document.getElementById('assetsContainer')
      if (assets.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<div class="icon">📭</div>' +
            '<div class="message">未找到可同步的资源</div>' +
          '</div>'
        return
      }

      var html = ''
      for (var i = 0; i < assets.length; i++) {
        var asset = assets[i]
        var icon = asset.type === 'image' ? '🖼' : '📝'
        var statusClass = asset.status
        var statusLabel = asset.status === 'new' ? '新增' : asset.status === 'changed' ? '变更' : '未变'

        html +=
          '<div class="asset-item">' +
            '<div class="asset-icon ' + asset.type + '">' + icon + '</div>' +
            '<div class="asset-info">' +
              '<div class="asset-name">' + escapeHtml(asset.fileName) + '</div>' +
              '<div class="asset-path">' + escapeHtml(asset.ossPath) + '</div>' +
            '</div>' +
            '<span class="asset-status ' + statusClass + '">' + statusLabel + '</span>' +
          '</div>'
      }
      container.innerHTML = html
    }

    function renderResults(results) {
      var container = document.getElementById('assetsContainer')
      var html = ''
      for (var i = 0; i < results.length; i++) {
        var result = results[i]
        var icon = result.type === 'image' ? '🖼' : '📝'
        var statusClass = result.status
        var statusLabel = result.status === 'uploaded' ? '已上传' : result.status === 'skipped' ? '已跳过' : '失败'
        var sizeStr = result.size > 1024 ? (result.size / 1024).toFixed(1) + ' KB' : result.size + ' B'

        html +=
          '<div class="asset-item">' +
            '<div class="asset-icon ' + result.type + '">' + icon + '</div>' +
            '<div class="asset-info">' +
              '<div class="asset-name">' + escapeHtml(result.fileName) + '</div>' +
              '<div class="asset-path">' + escapeHtml(result.ossPath) + '</div>' +
            '</div>' +
            '<span class="asset-size">' + sizeStr + '</span>' +
            '<span class="asset-status ' + statusClass + '">' + statusLabel + '</span>' +
          '</div>'
      }
      container.innerHTML = html
    }

    function updateStatus(count, text) {
      document.getElementById('statusBar').innerHTML =
        '<span class="status-text">' + (text || '就绪') + '</span>' +
        '<span class="count">' + count + ' 个资源</span>'
    }

    function showSummary(summary, results) {
      var summaryEl = document.getElementById('summary')
      summaryEl.style.display = 'block'

      var html =
        '<div class="summary-row">' +
          '<span>总计</span>' +
          '<span>' + summary.total + ' 个资源</span>' +
        '</div>' +
        '<div class="summary-row">' +
          '<span class="success">✓ 已上传</span>' +
          '<span class="success">' + summary.uploaded + '</span>' +
        '</div>'

      if (summary.skipped > 0) {
        html +=
          '<div class="summary-row">' +
            '<span class="warning">− 已跳过（未变更）</span>' +
            '<span class="warning">' + summary.skipped + '</span>' +
          '</div>'
      }

      if (summary.errors > 0) {
        html +=
          '<div class="summary-row">' +
            '<span class="error-text">✗ 失败</span>' +
            '<span class="error-text">' + summary.errors + '</span>' +
          '</div>' +
          '<div class="error-detail">'
        for (var j = 0; j < summary.errorDetails.length; j++) {
          var e = summary.errorDetails[j]
          html += escapeHtml(e.fileName) + ': ' + escapeHtml(e.error) + '<br>'
        }
        html += '</div>'
      }

      summaryEl.innerHTML = html
    }

    function showError(error) {
      var summaryEl = document.getElementById('summary')
      summaryEl.style.display = 'block'
      summaryEl.innerHTML =
        '<div class="summary-row">' +
          '<span class="error-text">❌ 同步失败</span>' +
        '</div>' +
        '<div class="error-detail">' + escapeHtml(error) + '</div>'
    }

    function updateProgress(percent) {
      document.getElementById('progressFill').style.width = Math.min(percent, 100) + '%'
    }

    /**
     * 带超时的 fetch 请求
     * 使用 AbortController 实现超时取消
     */
    function fetchWithTimeout(url, options, timeoutMs) {
      var controller = new AbortController()
      var timer = setTimeout(function() {
        controller.abort()
      }, timeoutMs || FETCH_TIMEOUT_MS)

      return fetch(url, {
        ...options,
        signal: controller.signal,
      }).then(function(response) {
        clearTimeout(timer)
        return response
      }).catch(function(err) {
        clearTimeout(timer)
        throw err
      })
    }

    /**
     * UI 线程上传资源（浏览器环境完全支持 FormData / Blob / AbortController）
     *
     * 架构说明：
     *   - 主线程（code.ts）负责 Figma 节点导出，数据通过 postMessage 传递
     *   - UI 线程（本函数）负责网络请求，支持 FormData 上传图片
     *   - 上传完成后通过 parent.postMessage 将结果传回主线程
     */
    async function uploadAssets(apiBase, apiToken, assets) {
      var results = []
      var total = assets.length

      for (var i = 0; i < total; i++) {
        var asset = assets[i]
        updateProgress(((i + 1) / total) * 100)

        if (asset.type === 'text') {
          // 文字资源：JSON 格式上传
          // Text asset: uploaded as JSON. Key/field names come from Figma layer names.
          try {
            var response = await fetchWithTimeout(apiBase + '/api/assets/upload', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                ...(apiToken ? { 'X-API-Key': apiToken } : {}),
              },
              body: JSON.stringify({
                files: [{
                  ossPath: asset.ossPath,
                  type: 'text',
                  content: asset.content,
                  encoding: 'utf-8',
                }],
              }),
            })
            var result = await response.json()
            if (result.success) {
              results.push({
                ossPath: asset.ossPath, fileName: asset.fileName,
                type: 'text', size: (asset.content || '').length,
                status: 'uploaded',
              })
            } else {
              results.push({
                ossPath: asset.ossPath, fileName: asset.fileName,
                type: 'text', size: 0, status: 'error',
                error: result.message || '上传失败',
              })
            }
          } catch (err) {
            var errorMsg = err.name === 'AbortError'
              ? '请求超时（超过 ' + FETCH_TIMEOUT_MS + 'ms）'
              : String(err)
            results.push({
              ossPath: asset.ossPath, fileName: asset.fileName,
              type: 'text', size: 0, status: 'error',
              error: errorMsg,
            })
          }
        } else {
          // 图片资源：FormData 上传（UI 浏览器环境完全支持）
          // IMAGE asset: upload via FormData/Blob (UI thread). fileName = Figma layer name.
          try {
            var formData = new FormData()
            var mimeType = asset.ossPath.toLowerCase().endsWith('.svg')
              ? 'image/svg+xml' : 'image/png'
            var blob = new Blob([asset.data], { type: mimeType })
            formData.append('files', blob, asset.fileName)
            formData.append('ossPath', asset.ossPath)
            formData.append('type', 'image')

            var response = await fetchWithTimeout(apiBase + '/api/assets/upload', {
              method: 'POST',
              headers: apiToken ? { 'X-API-Key': apiToken } : {},
              body: formData,
            })
            var result = await response.json()
            if (result.success) {
              results.push({
                ossPath: asset.ossPath, fileName: asset.fileName,
                type: 'image', size: blob.size, status: 'uploaded',
              })
            } else {
              results.push({
                ossPath: asset.ossPath, fileName: asset.fileName,
                type: 'image', size: 0, status: 'error',
                error: result.message || '上传失败',
              })
            }
          } catch (err) {
            var errorMsg = err.name === 'AbortError'
              ? '请求超时（超过 ' + FETCH_TIMEOUT_MS + 'ms）'
              : String(err)
            results.push({
              ossPath: asset.ossPath, fileName: asset.fileName,
              type: 'image', size: 0, status: 'error',
              error: errorMsg,
            })
          }
        }
      }

      // 汇总结果
      var uploaded = 0
      var skipped = 0
      var errors = []
      for (var k = 0; k < results.length; k++) {
        if (results[k].status === 'uploaded') uploaded++
        else if (results[k].status === 'skipped') skipped++
        else if (results[k].status === 'error') errors.push(results[k])
      }
      var summary = {
        total: total,
        uploaded: uploaded,
        skipped: skipped,
        errors: errors.length,
        errorDetails: errors,
      }

      // 通过 parent.postMessage 将结果传回主线程（日志记录 + 转发到 UI 显示）
      parent.postMessage({ pluginMessage: { type: 'sync-done', results: results, summary: summary } }, '*')
    }

    function handleSync() {
      if (isSyncing || assets.length === 0) return

      var apiBase = document.getElementById('apiBase').value.trim() || 'https://api.classicalab.cn'
      var apiToken = document.getElementById('apiToken').value.trim()

      // 发送消息到主线程
      parent.postMessage({ pluginMessage: { type: 'sync', assets: assets, apiBase: apiBase, apiToken: apiToken } }, '*')
    }

    // ================= 资源清单（后端全量，按课文 WEN 汇总） =================
    var inventoryData = null

    // 切换"上传清单 / 资源清单"页签
    function switchTab(tabName) {
      var tabs = document.querySelectorAll('.tab')
      for (var i = 0; i < tabs.length; i++) {
        var active = tabs[i].getAttribute('data-tab') === tabName
        tabs[i].className = 'tab' + (active ? ' active' : '')
      }
      document.getElementById('uploadView').style.display = tabName === 'upload' ? 'block' : 'none'
      document.getElementById('inventoryView').style.display = tabName === 'inventory' ? 'block' : 'none'
      // 首次打开"资源清单"页签时自动加载
      if (tabName === 'inventory' && !inventoryData) loadInventory()
    }

    // 文件大小显示（B / KB / MB）
    function humanSize(bytes) {
      var b = Number(bytes) || 0
      if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB'
      if (b >= 1024) return (b / 1024).toFixed(1) + ' KB'
      return b + ' B'
    }

    // 加载后端 /api/assets/inventory 资源清单
    async function loadInventory() {
      var container = document.getElementById('inventoryContainer')
      var loadBtn = document.getElementById('inventoryLoadBtn')
      if (loadBtn) { loadBtn.disabled = true; loadBtn.textContent = '加载中...' }
      container.innerHTML =
        '<div class="empty-state"><div class="icon">🔍</div><div class="message">正在加载资源清单...</div></div>'
      var apiBase = document.getElementById('apiBase').value.trim() || 'https://api.classicalab.cn'
      try {
        // 资源清单 = 直读 OSS 桶真实文件（区别于上传清单 version.json 的"声称已上传"），
        // 用于排查"显示上传成功、实际未上传到 OSS"的情况。
        var response = await fetchWithTimeout(apiBase + '/api/assets/oss-list', { method: 'GET' })
        if (!response.ok) throw new Error('HTTP ' + response.status)
        var json = await response.json()
        if (!json.success) throw new Error(json.message || '获取资源清单失败')
        inventoryData = json.data
        renderInventory(json.data)
      } catch (err) {
        container.innerHTML =
          '<div class="empty-state"><div class="icon">❌</div><div class="message">加载资源清单失败：' + escapeHtml(err.message || String(err)) + '</div></div>'
      } finally {
        if (loadBtn) { loadBtn.disabled = false; loadBtn.textContent = '刷新资源清单' }
      }
    }

    // 渲染资源清单（按 WEN 汇总 + 通用资源）
    function renderInventory(data) {
      var container = document.getElementById('inventoryContainer')
      var html = ''

      // 顶部统计
      html += '<div class="status-bar" style="margin-top:0">' +
        '<span class="status-text">资源总数：' + data.meta.total_assets + '</span>' +
        '<span class="count">同步时间：' + data.meta.last_sync_at + '</span>' +
        '</div>'

      // 按课文（WEN）汇总
      html += '<div class="inv-group-title">📖 按课文（WEN）汇总</div>'
      for (var i = 0; i < data.wen_list.length; i++) {
        html += renderWenRow(data.wen_list[i])
      }

      // 通用资源
      html += '<div class="inv-group-title">🌐 通用资源</div>'
      html += renderGeneralRow('样式', data.general.styles)
      html += renderGeneralRow('图片', data.general.images)
      html += renderGeneralRow('文字', data.general.texts)

      container.innerHTML = html
    }

    // 单个课文行（可折叠；无资源时置灰显示"无资源"）
    function renderWenRow(wen) {
      var itemCount = 0
      for (var i = 0; i < wen.screens.length; i++) {
        itemCount += wen.screens[i].images.length + wen.screens[i].styles.length
      }
      itemCount += wen.culture_cards.length + wen.other_images.length + wen.styles.length + wen.texts.length
      var dim = itemCount === 0 ? ' inv-empty' : ''
      var countLabel = itemCount === 0 ? '无资源' : itemCount + ' 项'
      return '<details class="inv-wen' + dim + '">' +
        '<summary>' +
          '<span class="inv-wen-id">' + wen.wen_id + '</span>' +
          '<span class="inv-wen-title">' + escapeHtml(wen.title) + '</span>' +
          '<span class="inv-count">' + countLabel + '</span>' +
        '</summary>' +
        '<div class="inv-body">' + renderWenBody(wen) + '</div>' +
        '</details>'
    }

    // WEN 明细分类
    function renderWenBody(wen) {
      var html = ''
      html += renderCatGroup('界面图片', wen.other_images)
      for (var i = 0; i < wen.screens.length; i++) {
        var s = wen.screens[i]
        html += renderCatGroup(s.screen_label + '（图片）', s.images)
        html += renderCatGroup(s.screen_label + '（样式）', s.styles)
      }
      html += renderCatGroup('文化卡片', wen.culture_cards)
      html += renderCatGroup('样式', wen.styles)
      html += renderCatGroup('文字', wen.texts)
      return html
    }

    // 通用资源行（可折叠）
    function renderGeneralRow(title, items) {
      if (!items || items.length === 0) return ''
      return '<details class="inv-wen">' +
        '<summary><span class="inv-wen-title">' + escapeHtml(title) + '</span><span class="inv-count">' + items.length + ' 项</span></summary>' +
        '<div class="inv-body">' + renderFileList(items) + '</div>' +
        '</details>'
    }

    // 分类分组（仅非空时输出）
    function renderCatGroup(title, items) {
      if (!items || items.length === 0) return ''
      return '<div class="inv-cat">' +
        '<div class="inv-cat-title">' + escapeHtml(title) + '（' + items.length + '）</div>' +
        renderFileList(items) +
        '</div>'
    }

    // 文件路径 + 大小列表
    function renderFileList(items) {
      var html = '<div class="inv-files">'
      for (var i = 0; i < items.length; i++) {
        html += '<div class="inv-file"><span>' + escapeHtml(items[i].oss_path) + '</span>' +
          '<span class="inv-file-meta">' + humanSize(items[i].size) + '</span></div>'
      }
      html += '</div>'
      return html
    }

    // 通知主线程 UI 已就绪
    parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*')
  </script>
</body>
</html>
