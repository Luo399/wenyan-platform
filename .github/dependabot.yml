version: 2
updates:
  # 前端依赖（仓库根目录）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 后端依赖
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Figma 插件依赖
  - package-ecosystem: npm
    directory: "/figma-plugin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
