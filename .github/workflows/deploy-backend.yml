name: Deploy Backend to Aliyun Server

# 生产后端部署（PM2 方式）
# 项目约定：生产后端用 PM2 守护，Docker 为历史残留。
# 本工作流只操作本项目自己的 PM2 进程，不再 docker rm -f / fuser -k / kill -9，
# 避免同机宝塔上的其它服务被误杀。
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:

# 部署只需要读仓库；不授予写权限（secrets 由 Environment/Repository 单独管理）
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 生产部署需要人工批准（在 GitHub Environment: production 里配置 Required reviewers）
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server via PM2
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 "${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
            set -e
            PROD_PATH="${{ secrets.SERVER_PROJECT_PATH }}"
            BRANCH="main"

            echo "=== [1/5] Clone or update repo ==="
            if [ ! -d "$PROD_PATH" ]; then
              git clone https://github.com/Luo399/wenyan-platform.git "$PROD_PATH"
            fi
            cd "$PROD_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "=== [2/5] Rebuild backend/.env (preserve existing keys) ==="
            # .env 不进 git，git reset 不会碰它。先完整备份，再按「保留旧值 + 覆盖受管键」重建。
            umask 077
            if [ -f backend/.env ]; then
              cp -p backend/.env backend/.env.prev
              echo "已备份现有 backend/.env → backend/.env.prev"
            else
              : > backend/.env.prev
              echo "WARNING: 未找到 backend/.env，将从空配置重建（首次部署）"
            fi

            # 只剔除本步骤会重新写入的键，其余键（DASHBOARD_PASSWORD、DEEPSEEK_API_KEY、
            # TEACHER_BACKEND_URL/TOKEN、AI_ALERT_WEBHOOK、日志/限流等）全部原样保留。
            grep -vE '^(PORT|CORS_ORIGIN|OSS_PUBLIC_URL|ALIYUN_OSS_BUCKET|ALIYUN_OSS_REGION|ALIYUN_ACCESS_KEY_ID|ALIYUN_ACCESS_KEY_SECRET)=' \
              backend/.env.prev > backend/.env || true

            echo "PORT=3000" >> backend/.env
            echo "CORS_ORIGIN=https://www.classicalab.cn,https://classicalab.cn,https://www.figma.com,https://needed-data.classicalab.cn" >> backend/.env

            # OSS 上传配置：复用前端桶 OSS_BUCKET（cn-zhongwei）。
            # 后端作为 Figma 插件上传中转，资源直接进前端生产桶，前端经 www.classicalab.cn 读取。
            if [ -n "${{ secrets.OSS_BUCKET }}" ]; then
              echo "OSS_PUBLIC_URL=https://${{ secrets.OSS_BUCKET }}.oss-cn-zhongwei.aliyuncs.com" >> backend/.env
              echo "ALIYUN_OSS_BUCKET=${{ secrets.OSS_BUCKET }}" >> backend/.env
              echo "ALIYUN_OSS_REGION=oss-cn-zhongwei" >> backend/.env
              echo "ALIYUN_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}" >> backend/.env
              echo "ALIYUN_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}" >> backend/.env
            else
              echo "WARNING: OSS_BUCKET not set, assets upload will fallback to local backend/data"
            fi

            # 旧值优先；旧 .env 里没有时才用 GitHub Secret 补齐。
            # 绝不自动生成/覆盖已有密钥，避免轮换导致 JWT 全部失效、直传凭证作废。
            inject_if_missing() {
              KEY="$1"
              VALUE="$2"
              if ! grep -qE "^${KEY}=.+" backend/.env && [ -n "$VALUE" ]; then
                printf '%s=%s\n' "$KEY" "$VALUE" >> backend/.env
                echo "$KEY 已从 GitHub Secret 注入"
              fi
            }
            inject_if_missing JWT_SECRET "${{ secrets.JWT_SECRET }}"
            inject_if_missing ASSET_SYNC_TOKEN "${{ secrets.ASSET_SYNC_TOKEN }}"
            inject_if_missing DASHBOARD_PASSWORD "${{ secrets.DASHBOARD_PASSWORD }}"
            inject_if_missing DEEPSEEK_API_KEY "${{ secrets.DEEPSEEK_API_KEY }}"

            # 必需变量校验：缺失则失败，只打印变量名，不打印值。
            MISSING_KEYS=""
            for KEY in JWT_SECRET ASSET_SYNC_TOKEN DASHBOARD_PASSWORD DEEPSEEK_API_KEY; do
              if ! grep -qE "^${KEY}=.+" backend/.env; then
                MISSING_KEYS="$MISSING_KEYS $KEY"
              fi
            done
            chmod 600 backend/.env
            if [ -n "$MISSING_KEYS" ]; then
              echo "ERROR: backend/.env 缺少必需变量:$MISSING_KEYS"
              echo "请先在服务器 $PWD/backend/.env 中补齐（或配置同名 GitHub Secret）后重新部署。"
              echo "旧配置完整保留在 backend/.env.prev，本次部署已终止。"
              exit 1
            fi
            rm -f backend/.env.prev

            echo "=== [3/5] Stop this project's PM2 process ==="
            # 只动本项目自己的进程；不碰 docker / fuser / 其它端口的进程。
            pm2 stop wenyan-backend >/dev/null 2>&1 || true
            pm2 delete wenyan-backend >/dev/null 2>&1 || true
            mkdir -p backend/database backend/data backend/logs

            echo "=== [4/5] Install deps and fresh start via PM2 ==="
            cd "$PROD_PATH/backend"
            # 必须从 backend 目录启动，dotenv 依赖当前目录查找 .env
            # 服务器残留的 node_modules（rc/glob 等旧包）与当前 Node 版本不兼容，
            # 会导致 sqlite3 原生模块 prebuild-install 崩溃（deepExtend.apply is not a function）。
            # 项目约定禁 npm ci（lock 文件可能不同步），这里先清空再全新安装。
            rm -rf node_modules
            npm install --omit=dev --no-audit --no-fund
            # 全新启动（而非 reload）：旧进程已删，干净进程绑定 3000，避免 EADDRINUSE 遗留
            pm2 start server.js --name wenyan-backend 2>/dev/null || pm2 restart wenyan-backend --update-env
            sleep 5
            cd "$PROD_PATH"

            echo "=== [5/5] Health check (with retry) ==="
            HEALTH_OK=false
            MAX_RETRIES=6
            RETRY_DELAY=10
            for ((i=1; i<=MAX_RETRIES; i++)); do
              echo "Attempt $i/$MAX_RETRIES to check health..."
              # 放在 if 条件内：避免 set -e 在 curl 连接失败（如端口刚释放/进程仍在起）时直接中断脚本
              # -f：HTTP 4xx/5xx 视为失败，不再把 500 当成功
              if RESP=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null) && grep -q '"success":true' <<< "$RESP"; then
                HEALTH_OK=true
                echo "=== Health check passed ==="
                break
              fi
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Health check failed, retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "HEALTH_CHECK_FAILED after $MAX_RETRIES attempts"
              echo "=== PM2 status ==="
              pm2 status wenyan-backend || true
              echo "=== PM2 log (tail) ==="
              pm2 logs wenyan-backend --lines 50 --nostream 2>&1 || true

              # 数据库损坏时会导致进程反复崩溃（PM2 AUTORESTART 循环）。
              # 注意：绝不再直接删除生产库。先备份（保留最近 3 份），再把疑似损坏的库
              # 改名隔离，由服务启动时重建空库；数据恢复必须人工完成。
              if pm2 stop wenyan-backend >/dev/null 2>&1; then
                echo "=== Attempting database recovery (backup first, never rm) ==="
                DB_FILE="backend/database/answers.db"
                if [ -f "$DB_FILE" ]; then
                  TS=$(date +%Y%m%d%H%M%S)
                  cp -p "$DB_FILE" "$DB_FILE.bak-$TS"
                  # WAL/SHM 里可能有尚未 checkpoint 的最新答题，一并备份
                  if [ -f "$DB_FILE-wal" ]; then cp -p "$DB_FILE-wal" "$DB_FILE-wal.bak-$TS"; fi
                  if [ -f "$DB_FILE-shm" ]; then cp -p "$DB_FILE-shm" "$DB_FILE-shm.bak-$TS"; fi
                  echo "已备份数据库: $DB_FILE.bak-$TS"
                  # 只保留最近 3 份备份
                  ls -1t "$DB_FILE".bak-* 2>/dev/null | tail -n +4 | while IFS= read -r OLD_BAK; do
                    rm -f "$OLD_BAK"
                  done
                  # 连同 WAL/SHM 一起隔离，避免旧 WAL 影响新建的空库
                  if [ -f "$DB_FILE-wal" ]; then mv "$DB_FILE-wal" "$DB_FILE-wal.corrupt-$TS"; fi
                  if [ -f "$DB_FILE-shm" ]; then mv "$DB_FILE-shm" "$DB_FILE-shm.corrupt-$TS"; fi
                  mv "$DB_FILE" "$DB_FILE.corrupt-$TS"
                  echo "============================================================"
                  echo "WARNING: 数据库健康检查失败，已将疑似损坏的库隔离为："
                  echo "  $DB_FILE.corrupt-$TS"
                  echo "原始数据未删除，最近备份：$DB_FILE.bak-$TS（保留最近 3 份）"
                  echo ">>> 需人工恢复答题数据：核对 .corrupt-* / .bak-* 后手动导回 <<<"
                  echo "服务将以空库重启，请勿把空库当最终状态。"
                  echo "============================================================"
                else
                  echo "未找到 $DB_FILE，跳过备份，直接由服务重建空库"
                fi
                pm2 restart wenyan-backend --update-env
                for ((i=1; i<=MAX_RETRIES; i++)); do
                  echo "Recovery attempt $i/$MAX_RETRIES to check health..."
                  if RESP=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null) && grep -q '"success":true' <<< "$RESP"; then
                    HEALTH_OK=true
                    echo "=== Database recovery successful (需人工恢复数据) ==="
                    break
                  fi
                  if [ $i -lt $MAX_RETRIES ]; then
                    sleep $RETRY_DELAY
                  fi
                done
                if [ "$HEALTH_OK" != "true" ]; then
                  echo "=== Database recovery failed ==="
                  pm2 logs wenyan-backend --lines 50 --nostream 2>&1 || true
                fi
              fi
            fi

            if [ "$HEALTH_OK" != "true" ]; then
              echo "FATAL: Backend health check failed after all recovery attempts"
              exit 1
            fi
          EOF
