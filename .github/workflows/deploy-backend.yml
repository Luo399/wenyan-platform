name: Deploy Backend to Aliyun Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: crpi-jr4tvb4f0ycb6nzt.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: luo-hui-ning/wenyan-platform-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify image push
        run: |
          echo "=== Verifying pushed image ==="
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --format '{{json .}}' 2>&1 || echo "WARNING: Image verification failed (may be transient)"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            PROD_PATH="${{ secrets.SERVER_PROJECT_PATH }}"
            BRANCH="main"

            echo "=== [1/4] Clone or update repo ==="
            if [ ! -d "$PROD_PATH" ]; then
              git clone https://github.com/Luo399/wenyan-platform.git "$PROD_PATH"
            fi
            cd "$PROD_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "=== [2/4] Create .env file ==="
            if [ -f backend/.env ]; then
              cp backend/.env backend/.env.bak
            fi
            echo "PORT=3000" > backend/.env
            echo "CORS_ORIGIN=https://www.classicalab.cn,https://classicalab.cn,https://www.figma.com,https://needed-data.classicalab.cn" >> backend/.env
            SAVED_SECRET=""
            if [ -f backend/.env.bak ]; then
              SAVED_SECRET=$(grep '^JWT_SECRET=' backend/.env.bak | cut -d= -f2-)
            fi
            if [ -n "$SAVED_SECRET" ]; then
              echo "JWT_SECRET=$SAVED_SECRET" >> backend/.env
              echo "JWT_SECRET restored from backup"
            elif [ -n "${{ secrets.JWT_SECRET }}" ]; then
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
              echo "JWT_SECRET set from GitHub Secret"
            else
              NEW_SECRET=$(openssl rand -hex 32)
              echo "JWT_SECRET=$NEW_SECRET" >> backend/.env
              echo "JWT_SECRET auto-generated"
            fi
            # ASSET_SYNC_TOKEN：保留备份值或从 Secret 读取
            SAVED_TOKEN=""
            if [ -f backend/.env.bak ]; then
              SAVED_TOKEN=$(grep '^ASSET_SYNC_TOKEN=' backend/.env.bak | cut -d= -f2-)
            fi
            if [ -n "$SAVED_TOKEN" ]; then
              echo "ASSET_SYNC_TOKEN=$SAVED_TOKEN" >> backend/.env
              echo "ASSET_SYNC_TOKEN restored from backup"
            elif [ -n "${{ secrets.ASSET_SYNC_TOKEN }}" ]; then
              echo "ASSET_SYNC_TOKEN=${{ secrets.ASSET_SYNC_TOKEN }}" >> backend/.env
              echo "ASSET_SYNC_TOKEN set from GitHub Secret"
            fi
            rm -f backend/.env.bak

            echo "OSS_PUBLIC_URL=https://wenyan-online.oss-cn-guangzhou.aliyuncs.com" >> backend/.env

            echo "=== [3/5] Install Docker if not present ==="
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              dnf install -y --disablerepo='nodesource-*' dnf-utils device-mapper-persistent-data lvm2
              dnf config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
              dnf install -y --disablerepo='nodesource-*' docker-ce docker-ce-cli containerd.io docker-compose-plugin
              systemctl enable --now docker
              echo "Docker installed successfully"
            else
              echo "Docker already installed"
            fi

            echo "=== [3b] Check server time ==="
            SERVER_TIME=$(date +%s)
            echo "Server time: $(date -d @$SERVER_TIME '+%Y-%m-%d %H:%M:%S')"

            REF_TIME="${{ github.event.repository.updated_at }}"
            REF_TS=$(date -d "$REF_TIME" +%s 2>/dev/null || echo "0")
            if [ "$REF_TS" -ne 0 ]; then
              DIFF=$((SERVER_TIME - REF_TS))
              echo "Time diff: ${DIFF#-} seconds"
              if [ "${DIFF#-}" -gt 300 ]; then
                echo "WARNING: Server time off by more than 5 minutes, syncing..."
                if command -v chronyd &>/dev/null; then
                  chronyd -q 'server ntp.aliyun.com iburst' 2>/dev/null || true
                elif command -v ntpdate &>/dev/null; then
                  ntpdate -u ntp.aliyun.com 2>/dev/null || true
                else
                  dnf install -y chrony 2>/dev/null
                  chronyd -q 'server ntp.aliyun.com iburst' 2>/dev/null || true
                fi
                echo "Time after sync: $(date '+%Y-%m-%d %H:%M:%S')"
              else
                echo "Server time is within acceptable range"
              fi
            fi

            echo "=== [4/5] Login to ACR and pull latest image ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password-stdin \
              ${{ env.REGISTRY }}
            docker compose pull

            echo "=== [5/5] Restart backend ==="
            docker rm -f wenyan-backend 2>/dev/null || true
            # 释放 3000 端口：可能出现残留 PM2 进程（如旧的 /www/wwwroot/api.classicalab.cn 部署）
            # 占用 3000 导致 Docker 容器 bind 失败（项目经验：PM2 与 Docker 不能同时监听同一端口）。
            # 这里统一停掉占用 3000 的进程，避免健康检查 FATAL。
            echo "Releasing port 3000 (stop stale process holding 3000)..."
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 2
            mkdir -p backend/database backend/data backend/logs
            chown -R 1000:1000 backend/database backend/data backend/logs
            # 重新确保旧容器已移除（可能在端口释放后更稳妥地重新创建）
            docker rm -f wenyan-backend 2>/dev/null || true
            docker compose up -d --remove-orphans

            echo "=== Health check (with retry) ==="
            HEALTH_OK=false
            MAX_RETRIES=6
            RETRY_DELAY=10
            for ((i=1; i<=MAX_RETRIES; i++)); do
              echo "Attempt $i/$MAX_RETRIES to check health..."
              if curl -s http://127.0.0.1:3000/api/health 2>/dev/null; then
                HEALTH_OK=true
                echo "=== Health check passed ==="
                break
              fi
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Health check failed, retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "HEALTH_CHECK_FAILED after $MAX_RETRIES attempts"
              echo "=== Container logs ==="
              docker logs wenyan-backend 2>&1 || true
              echo "=== Container status ==="
              docker ps -a --filter name=wenyan-backend --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

              # 检查容器是否在重启循环（如 SQLITE_CORRUPT 导致反复崩溃）
              CONTAINER_STATUS=$(docker ps -a --filter name=wenyan-backend --format "{{.Status}}")
              if echo "$CONTAINER_STATUS" | grep -q "Restarting"; then
                echo "=== Container is restarting, attempting database recovery ==="
                docker compose down
                echo "Removing database file to fix corruption..."
                rm -f backend/database/answers.db
                docker rm -f wenyan-backend 2>/dev/null || true
                echo "Database file removed, restarting container..."
                docker compose up -d --remove-orphans
                # 恢复后重试健康检查
                for ((i=1; i<=MAX_RETRIES; i++)); do
                  echo "Recovery attempt $i/$MAX_RETRIES to check health..."
                  if curl -s http://127.0.0.1:3000/api/health 2>/dev/null; then
                    HEALTH_OK=true
                    echo "=== Database recovery successful ==="
                    break
                  fi
                  if [ $i -lt $MAX_RETRIES ]; then
                    sleep $RETRY_DELAY
                  fi
                done
                if [ "$HEALTH_OK" != "true" ]; then
                  echo "=== Database recovery failed ==="
                  docker logs wenyan-backend 2>&1 || true
                fi
              fi
            fi

            if [ "$HEALTH_OK" != "true" ]; then
              echo "FATAL: Backend health check failed after all recovery attempts"
              exit 1
            fi
          EOF