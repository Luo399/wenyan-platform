name: Deploy Backend to Aliyun Server

# 生产后端部署（PM2 方式）
# 项目约定：生产后端用 PM2 守护，Docker 为历史残留，部署时先清除以免 3000 端口冲突。
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server via PM2
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            PROD_PATH="${{ secrets.SERVER_PROJECT_PATH }}"
            BRANCH="main"

            echo "=== [1/5] Clone or update repo ==="
            if [ ! -d "$PROD_PATH" ]; then
              git clone https://github.com/Luo399/wenyan-platform.git "$PROD_PATH"
            fi
            cd "$PROD_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "=== [2/5] Create .env file ==="
            if [ -f backend/.env ]; then
              cp backend/.env backend/.env.bak
            fi
            echo "PORT=3000" > backend/.env
            echo "CORS_ORIGIN=https://www.classicalab.cn,https://classicalab.cn,https://www.figma.com,https://needed-data.classicalab.cn" >> backend/.env
            # JWT_SECRET：保留备份值或从 Secret 读取，最后兜底自动生成
            SAVED_SECRET=""
            if [ -f backend/.env.bak ]; then
              SAVED_SECRET=$(grep '^JWT_SECRET=' backend/.env.bak | cut -d= -f2-)
            fi
            if [ -n "$SAVED_SECRET" ]; then
              echo "JWT_SECRET=$SAVED_SECRET" >> backend/.env
              echo "JWT_SECRET restored from backup"
            elif [ -n "${{ secrets.JWT_SECRET }}" ]; then
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
              echo "JWT_SECRET set from GitHub Secret"
            else
              NEW_SECRET=$(openssl rand -hex 32)
              echo "JWT_SECRET=$NEW_SECRET" >> backend/.env
              echo "JWT_SECRET auto-generated"
            fi
            # ASSET_SYNC_TOKEN：尽可能保留原值避免破坏已签发的直传凭证
            SAVED_TOKEN=""
            if [ -f backend/.env.bak ]; then
              SAVED_TOKEN=$(grep '^ASSET_SYNC_TOKEN=' backend/.env.bak | cut -d= -f2-)
            fi
            if [ -n "$SAVED_TOKEN" ]; then
              echo "ASSET_SYNC_TOKEN=$SAVED_TOKEN" >> backend/.env
              echo "ASSET_SYNC_TOKEN restored from backup"
            elif [ -n "${{ secrets.ASSET_SYNC_TOKEN }}" ]; then
              echo "ASSET_SYNC_TOKEN=${{ secrets.ASSET_SYNC_TOKEN }}" >> backend/.env
              echo "ASSET_SYNC_TOKEN set from GitHub Secret"
            fi
            rm -f backend/.env.bak

            # OSS 上传配置：复用前端桶 OSS_BUCKET（classic-chinese, cn-zhongwei）。
            # 后端作为 Figma 插件上传中转，资源直接进前端生产桶，前端经 www.classicalab.cn 读取。
            if [ -n "${{ secrets.OSS_BUCKET }}" ]; then
              echo "OSS_PUBLIC_URL=https://${{ secrets.OSS_BUCKET }}.oss-cn-zhongwei.aliyuncs.com" >> backend/.env
              echo "ALIYUN_OSS_BUCKET=${{ secrets.OSS_BUCKET }}" >> backend/.env
              echo "ALIYUN_OSS_REGION=oss-cn-zhongwei" >> backend/.env
              echo "ALIYUN_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}" >> backend/.env
              echo "ALIYUN_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}" >> backend/.env
            else
              echo "WARNING: OSS_BUCKET not set, assets upload will fallback to local backend/data"
            fi

            echo "=== [3/5] Release port 3000 (生产回归 PM2) ==="
            # 项目约定：生产后端使用 PM2，Docker 为历史残留。
            # 目标：确保 3000 在 PM2 启动前彻底空闲，杜绝 EADDRINUSE 导致的 crash-loop。
            # 1) 停掉并删除旧的 wenyan-backend 进程，避免旧进程 crash-loop 干扰新进程绑定
            pm2 delete wenyan-backend >/dev/null 2>&1 || true
            pm2 flush wenyan-backend >/dev/null 2>&1 || true
            # 2) 清除所有发布 3000 端口的 Docker 容器（不限名称）并 down compose
            docker ps -a --format '{{.ID}} {{.Ports}}' 2>/dev/null | grep '3000' | awk '{print $1}' | xargs --no-run-if-empty docker rm -f
            docker compose down >/dev/null 2>&1 || true
            # 3) 反复清空宿主机上占用 3000 的进程（fuser + ss 兜底，覆盖 docker-proxy 被 docker 重新拉起的情况）
            for i in 1 2 3; do
              command -v fuser >/dev/null 2>&1 && fuser -k 3000/tcp >/dev/null 2>&1 || true
              if command -v ss >/dev/null 2>&1; then
                for PID in $(ss -ltnpH 2>/dev/null | grep -oP ':(3000)\s.*pid=\K[0-9]+' | sort -u); do
                  kill -9 "$PID" >/dev/null 2>&1 || true
                done
              fi
              sleep 2
            done
            mkdir -p backend/database backend/data backend/logs

            echo "=== [4/5] Install deps and fresh start via PM2 ==="
            cd "$PROD_PATH/backend"
            # 必须从 backend 目录启动，dotenv 依赖当前目录查找 .env
            # 服务器残留的 node_modules（rc/glob 等旧包）与当前 Node 版本不兼容，
            # 会导致 sqlite3 原生模块 prebuild-install 崩溃（deepExtend.apply is not a function）。
            # 这里先清空再全新安装（项目约定禁 npm ci，lock 文件不同步）。
            rm -rf node_modules
            npm install --production
            # 全新启动（而非 reload）：旧进程已删，干净进程绑定 3000，避免 EADDRINUSE 遗留
            pm2 start server.js --name wenyan-backend 2>/dev/null || pm2 restart wenyan-backend --update-env
            sleep 5
            cd "$PROD_PATH"

            echo "=== [5/5] Health check (with retry) ==="
            HEALTH_OK=false
            MAX_RETRIES=6
            RETRY_DELAY=10
            for ((i=1; i<=MAX_RETRIES; i++)); do
              echo "Attempt $i/$MAX_RETRIES to check health..."
              # 放在 if 条件内：避免 set -e 在 curl 连接失败（如端口刚释放/进程仍在起）时直接中断脚本
              if RESP=$(curl -s http://127.0.0.1:3000/api/health 2>/dev/null) && echo "$RESP" | grep -q '"success":true'; then
                HEALTH_OK=true
                echo "=== Health check passed ==="
                break
              fi
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Health check failed, retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "HEALTH_CHECK_FAILED after $MAX_RETRIES attempts"
              echo "=== PM2 status ==="
              pm2 status wenyan-backend || true
              echo "=== PM2 log (tail) ==="
              pm2 logs wenyan-backend --lines 50 --nostream 2>&1 || true

              # 数据库损坏时会导致进程反复崩溃（PM2 AUTORESTART 循环），检测并重建
              PM2_STATUS=$(pm2 status wenyan-backend --porcelain 2>/dev/null | grep wenyan-backend || echo "")
              if pm2 stop wenyan-backend >/dev/null 2>&1; then
                echo "=== Attempting database recovery ==="
                rm -f backend/database/answers.db
                pm2 restart wenyan-backend --update-env
                for ((i=1; i<=MAX_RETRIES; i++)); do
                  echo "Recovery attempt $i/$MAX_RETRIES to check health..."
                  if RESP=$(curl -s http://127.0.0.1:3000/api/health 2>/dev/null) && echo "$RESP" | grep -q '"success":true'; then
                    HEALTH_OK=true
                    echo "=== Database recovery successful ==="
                    break
                  fi
                  if [ $i -lt $MAX_RETRIES ]; then
                    sleep $RETRY_DELAY
                  fi
                done
                if [ "$HEALTH_OK" != "true" ]; then
                  echo "=== Database recovery failed ==="
                  pm2 logs wenyan-backend --lines 50 --nostream 2>&1 || true
                fi
              fi
            fi

            if [ "$HEALTH_OK" != "true" ]; then
              echo "FATAL: Backend health check failed after all recovery attempts"
              exit 1
            fi
          EOF