name: Deploy Backend to Aliyun Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: crpi-jr4tvb4f0ycb6nzt.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: luo-hui-ning/wenyan-platform-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            PROD_PATH="${{ secrets.SERVER_PROJECT_PATH }}"
            BRANCH="main"

            echo "=== [1/4] Clone or update repo ==="
            if [ ! -d "$PROD_PATH" ]; then
              git clone https://github.com/Luo399/wenyan-platform.git "$PROD_PATH"
            fi
            cd "$PROD_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "=== [2/4] Create .env file ==="
            echo "PORT=3000" > backend/.env
            echo "CORS_ORIGIN=https://www.classicalab.cn,https://classicalab.cn" >> backend/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env

            echo "=== [3/5] Install Docker if not present ==="
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              # 跳过 nodesource 仓库（超时），使用阿里云镜像
              dnf install -y --disablerepo='nodesource-*' dnf-utils device-mapper-persistent-data lvm2
              dnf config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
              dnf install -y --disablerepo='nodesource-*' docker-ce docker-ce-cli containerd.io docker-compose-plugin
              systemctl enable --now docker
              echo "Docker installed successfully"
            else
              echo "Docker already installed"
            fi

            echo "=== [4/5] Login to ACR and pull latest image ==="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password-stdin \
              ${{ env.REGISTRY }}
            docker compose pull

            echo "=== [5/5] Restart backend ==="
            docker compose up -d --remove-orphans
            sleep 3

            echo "=== Health check ==="
            curl -s http://127.0.0.1:3000/api/health || echo "HEALTH_CHECK_FAILED"
          EOF