name: Deploy Frontend to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'internal-dashboard/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.classicalab.cn
          VITE_OSS_BASE_URL: https://www.classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      - name: Deploy to Aliyun OSS (main bucket)
        run: |
          # 先上传所有资源文件（带 hash 的 JS/CSS 等），设置长缓存
          ./ossutil64 cp -r ./dist oss://${{ secrets.OSS_BUCKET }}/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:public,max-age=31536000"
          # 再单独上传 index.html，设置不缓存，确保用户总能获取最新版本
          ./ossutil64 cp ./dist/index.html oss://${{ secrets.OSS_BUCKET }}/index.html \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:no-cache" \
            --force

      - name: Deploy internal dashboard to needed-data bucket
        run: |
          if [ -n "${{ secrets.OSS_BUCKET_DASHBOARD }}" ]; then
            ./ossutil64 cp ./internal-dashboard/index.html oss://${{ secrets.OSS_BUCKET_DASHBOARD }}/index.html \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-guangzhou.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:public,max-age=3600" \
              --force
          else
            echo "OSS_BUCKET_DASHBOARD not set, skipping dashboard deployment"
          fi

      - name: Refresh Alibaba Cloud CDN cache (www.classicalab.cn)
        run: |
          # 使用 aliyun CLI 刷新 CDN 缓存，确保 www 域名也能立即获取最新版本
          if [ -n "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then
            wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
            tar xzf aliyun-cli-linux-latest-amd64.tgz
            chmod +x aliyun
            ./aliyun configure set --access-key-id ${{ secrets.OSS_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.OSS_ACCESS_KEY_SECRET }} --region cn-zhongwei
            # 刷新 www 域名的根目录缓存
            ./aliyun cdn RefreshObjectCaches --ObjectPath "https://www.classicalab.cn/" --ObjectType Directory || \
              echo "Warning: CDN refresh failed, user may need to clear browser cache manually"
          else
            echo "OSS_ACCESS_KEY_ID not set, skipping CDN cache refresh"
          fi

      - name: Purge CloudFront CDN cache (legacy)
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache purge"
          fi
