name: Deploy Frontend to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'internal-dashboard/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# 部署只需要读仓库；不授予写权限
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 生产部署需要人工批准（GitHub Environment: production）
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.classicalab.cn
          VITE_OSS_BASE_URL: https://www.classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      # 缓存策略分组（此前整目录 max-age=31536000, immutable，导致 data/*.json 与
      # index.html 一年不更新）：
      #   1) 其余静态资源         → 1 天
      #   2) dist/assets/**（带 hash）→ 1 年 immutable
      #   3) dist/data/**          → no-cache（数据更新必须立刻生效）
      #   4) index.html / favicon.ico / fonts/** → no-cache
      # 先传「其余」，再用后两组覆盖对应路径，即使 exclude 规则失效，
      # 最终这些路径的缓存头也会被后传的请求修正。
      - name: Deploy static files (1 day cache)
        run: |
          ./ossutil64 cp -r ./dist oss://${{ secrets.OSS_BUCKET }}/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --exclude "assets/*" \
            --exclude "data/*" \
            --exclude "fonts/*" \
            --exclude "index.html" \
            --exclude "favicon.ico" \
            --meta "Cache-Control:public,max-age=86400"

      - name: Deploy hashed assets (1 year immutable)
        run: |
          ./ossutil64 cp -r ./dist/assets oss://${{ secrets.OSS_BUCKET }}/assets/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:public,max-age=31536000,immutable"

      - name: Deploy data JSON (always revalidate)
        run: |
          if [ -d ./dist/data ]; then
            ./ossutil64 cp -r ./dist/data oss://${{ secrets.OSS_BUCKET }}/data/ --force \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-zhongwei.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache"
          else
            echo "dist/data not found, skipping"
          fi

      - name: Deploy entry files (no-cache)
        run: |
          ./ossutil64 cp ./dist/index.html oss://${{ secrets.OSS_BUCKET }}/index.html \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:no-cache" \
            --force
          if [ -f ./dist/favicon.ico ]; then
            ./ossutil64 cp ./dist/favicon.ico oss://${{ secrets.OSS_BUCKET }}/favicon.ico \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-zhongwei.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache" \
              --force
          fi
          if [ -d ./dist/fonts ]; then
            ./ossutil64 cp -r ./dist/fonts oss://${{ secrets.OSS_BUCKET }}/fonts/ \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-zhongwei.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache" \
              --force
          fi

      - name: Deploy internal dashboard to needed-data bucket
        run: |
          if [ -n "${{ secrets.OSS_BUCKET_DASHBOARD }}" ]; then
            ./ossutil64 cp ./internal-dashboard/index.html oss://${{ secrets.OSS_BUCKET_DASHBOARD }}/index.html \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-guangzhou.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:public,max-age=3600" \
              --force
          else
            echo "OSS_BUCKET_DASHBOARD not set, skipping dashboard deployment"
          fi

      - name: Refresh Alibaba Cloud CDN cache (www.classicalab.cn)
        run: |
          # 使用 aliyun CLI 刷新 CDN 缓存，确保 www 域名也能立即获取最新版本
          if [ -n "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then
            wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
            tar xzf aliyun-cli-linux-latest-amd64.tgz
            chmod +x aliyun
            ./aliyun configure set --access-key-id ${{ secrets.OSS_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.OSS_ACCESS_KEY_SECRET }} --region cn-zhongwei
            # 根目录 + data/ + index.html：入口与数据必须立即失效
            ./aliyun cdn RefreshObjectCaches --ObjectPath "https://www.classicalab.cn/" --ObjectType Directory || \
              echo "Warning: CDN refresh failed for /"
            ./aliyun cdn RefreshObjectCaches --ObjectPath "https://www.classicalab.cn/data/" --ObjectType Directory || \
              echo "Warning: CDN refresh failed for /data/"
            ./aliyun cdn RefreshObjectCaches --ObjectPath "https://www.classicalab.cn/index.html" --ObjectType File || \
              echo "Warning: CDN refresh failed for /index.html"
          else
            echo "OSS_ACCESS_KEY_ID not set, skipping CDN cache refresh"
          fi

      - name: Purge CloudFront CDN cache (legacy)
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache purge"
          fi
