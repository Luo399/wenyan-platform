name: Deploy Frontend to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.classicalab.cn
          VITE_OSS_BASE_URL: https://classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      - name: Sync to Aliyun OSS
        run: |
          # E10: 用 sync 增量同步替代 cp -r 全量上传
          # 注意：不加 --delete，避免误删 OSS 桶中手动维护的 audio/video/images/data 等大资源
          ./ossutil64 sync ./dist oss://${{ secrets.OSS_BUCKET }}/ \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-zhongwei.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:public,max-age=31536000"

      - name: Purge CDN cache (entry files only)
        run: |
          # 安全规则 C.4 / E09: 带 hash 的资源自带版本号无需失效；仅失效无 hash 的入口文件
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/index.html" "/favicon.ico" "/robots.txt"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache purge"
          fi
