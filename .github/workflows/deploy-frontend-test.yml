name: Deploy Frontend to Test OSS

on:
  push:
    branches:
      - feature-1
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend-test.yml'

# 部署只需要读仓库；不授予写权限
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://test-api.classicalab.cn
          VITE_OSS_BASE_URL: https://test.classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      # 与生产一致的分组缓存策略：
      #   其余静态资源 1 天；assets/** 1 年 immutable；data/**、index.html、favicon.ico、fonts/** no-cache
      - name: Deploy static files (1 day cache)
        run: |
          ./ossutil64 cp -r ./dist oss://${{ secrets.OSS_TEST_BUCKET }}/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-guangzhou.aliyuncs.com \
            --acl public-read \
            --exclude "assets/*" \
            --exclude "data/*" \
            --exclude "fonts/*" \
            --exclude "index.html" \
            --exclude "favicon.ico" \
            --meta "Cache-Control:public,max-age=86400"

      - name: Deploy hashed assets (1 year immutable)
        run: |
          ./ossutil64 cp -r ./dist/assets oss://${{ secrets.OSS_TEST_BUCKET }}/assets/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-guangzhou.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:public,max-age=31536000,immutable"

      - name: Deploy data JSON (always revalidate)
        run: |
          if [ -d ./dist/data ]; then
            ./ossutil64 cp -r ./dist/data oss://${{ secrets.OSS_TEST_BUCKET }}/data/ --force \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-guangzhou.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache"
          else
            echo "dist/data not found, skipping"
          fi

      - name: Deploy entry files (no-cache)
        run: |
          ./ossutil64 cp ./dist/index.html oss://${{ secrets.OSS_TEST_BUCKET }}/index.html \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-guangzhou.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:no-cache" \
            --force
          if [ -f ./dist/favicon.ico ]; then
            ./ossutil64 cp ./dist/favicon.ico oss://${{ secrets.OSS_TEST_BUCKET }}/favicon.ico \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-guangzhou.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache" \
              --force
          fi
          if [ -d ./dist/fonts ]; then
            ./ossutil64 cp -r ./dist/fonts oss://${{ secrets.OSS_TEST_BUCKET }}/fonts/ \
              -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
              -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e oss-cn-guangzhou.aliyuncs.com \
              --acl public-read \
              --meta "Cache-Control:no-cache" \
              --force
          fi
