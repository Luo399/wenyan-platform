name: Deploy Frontend to Test OSS

on:
  push:
    branches:
      - feature-1
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend-test.yml'

# 部署只需要读仓库；不授予写权限
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://test-api.classicalab.cn
          VITE_OSS_BASE_URL: https://test.classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      # 与生产一致的分组缓存策略：
      #   其余静态资源 1 天；assets/** 1 年 immutable；data/**、index.html、favicon.ico、fonts/** no-cache
      - name: Deploy static files (1 day cache)
        run: |
          set -euo pipefail
          OSS_ARGS=(-i "${{ secrets.OSS_ACCESS_KEY_ID }}" -k "${{ secrets.OSS_ACCESS_KEY_SECRET }}" -e oss-cn-guangzhou.aliyuncs.com --acl public-read --force)
          BUCKET="oss://${{ secrets.OSS_TEST_BUCKET }}"

          # 与生产同一套缓存契约：长缓存只给带 hash 的 assets/，index.html 单独 no-cache。
          # 旧写法整个 dist（含 index.html）先打一年缓存再补传修正，顺序一失败就造出永久卡旧版的客户端。
          ./ossutil64 cp -r ./dist/assets "${BUCKET}/assets/" "${OSS_ARGS[@]}" \
            --meta "Cache-Control:public,max-age=31536000,immutable"

          ./ossutil64 cp ./dist/index.html "${BUCKET}/index.html" "${OSS_ARGS[@]}" \
            --meta "Cache-Control:no-cache"

          # data/、fonts/、favicon.ico 也走 no-cache：素材 JSON 改了必须立刻生效，
          # 否则客户端拿着缓存里的旧 data，会看到和本次代码不一致的篇目清单。
          if [ -d ./dist/data ]; then
            ./ossutil64 cp -r ./dist/data "${BUCKET}/data/" "${OSS_ARGS[@]}" \
              --meta "Cache-Control:no-cache"
          fi
          if [ -d ./dist/fonts ]; then
            ./ossutil64 cp -r ./dist/fonts "${BUCKET}/fonts/" "${OSS_ARGS[@]}" \
              --meta "Cache-Control:no-cache"
          fi
          if [ -f ./dist/favicon.ico ]; then
            ./ossutil64 cp ./dist/favicon.ico "${BUCKET}/favicon.ico" "${OSS_ARGS[@]}" \
              --meta "Cache-Control:no-cache"
          fi

          # 其余顶层产物给 1 天
          for entry in ./dist/*; do
            base="$(basename "${entry}")"
            case "${base}" in
              assets|index.html|data|fonts|favicon.ico) continue ;;
            esac
            ./ossutil64 cp -r "${entry}" "${BUCKET}/${base}" "${OSS_ARGS[@]}" \
              --meta "Cache-Control:public,max-age=86400"
          done

      - name: Record expected build fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          hash="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' ./dist/index.html | head -1 || true)"
          if [ -z "${hash}" ]; then
            echo "::error::dist/index.html 里找不到 /assets/index-*.js，无法自检"
            exit 1
          fi
          echo "value=${hash}" >> "$GITHUB_OUTPUT"
          echo "本次构建入口：${hash}"

      - name: Verify test URL serves this build
        run: |
          set -euo pipefail
          expected="${{ steps.fingerprint.outputs.value }}"
          # 测试域名实测是 OSS 直连（响应头 Server: AliyunOSS，无 Via/X-Cache），不需要 CDN 刷新。
          # -k 是临时措施：test.classicalab.cn 的证书主机名不匹配（ERR_CERT_COMMON_NAME_INVALID），
          # 换证书后去掉 -k，见 docs/maintenance/release-freshness-plan.md 的证书待办。
          url="https://test.classicalab.cn/"
          got=""
          for i in $(seq 1 12); do
            got="$(curl -sSk -m 30 "${url}" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)"
            echo "[$i] ${url} -> ${got:-<empty>} (期望 ${expected})"
            if [ "${got}" = "${expected}" ]; then
              echo "测试入口已指向本次构建。"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url} 仍返回 ${got:-<empty>}，与本次构建 ${expected} 不符，别把它当成部署成功。"
          exit 1
