name: Deploy Frontend to Test OSS

on:
  push:
    branches:
      - feature-1
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/deploy-frontend-test.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://test-api.classicalab.cn
          VITE_OSS_BASE_URL: https://test.classicalab.cn

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64

      - name: Deploy to Aliyun OSS test bucket
        run: |
          # 先上传所有资源文件（带 hash 的 JS/CSS 等），设置长缓存
          ./ossutil64 cp -r ./dist oss://${{ secrets.OSS_TEST_BUCKET }}/ --force \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-guangzhou.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:public,max-age=31536000"
          # 再单独上传 index.html，设置不缓存，确保用户总能获取最新版本
          ./ossutil64 cp ./dist/index.html oss://${{ secrets.OSS_TEST_BUCKET }}/index.html \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -e oss-cn-guangzhou.aliyuncs.com \
            --acl public-read \
            --meta "Cache-Control:no-cache" \
            --force
