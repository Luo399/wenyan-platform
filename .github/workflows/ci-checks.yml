name: CI Checks

on:
  pull_request:
    branches:
      - main
      - feature-1
  push:
    branches:
      - 'trae/agent-*'
      - 'feature/**'
    paths:
      - 'src/**'
      - 'backend/**'
      - 'figma-plugin/**'
      - 'package.json'
      - '.github/workflows/ci-checks.yml'

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: true

  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Check backend syntax
        run: |
          cd backend
          node -c server.js

      - name: Run backend database & API tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          JWT_SECRET: ci-test-secret
          AUTH_SECRET: ''

  pipeline-test:
    # 数据管道（data-pipeline/python）Python 单元测试
    # 对应 docs/refactor/07-data-pipeline.md P01
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/python/pyproject.toml

      - name: Install pipeline package and test dependencies
        # 以可编辑模式安装 data-pipeline/python，同时安装 [test] 可选依赖（pytest）
        run: |
          pip install --upgrade pip
          pip install -e "data-pipeline/python[test]"

      - name: Run pytest
        run: |
          cd data-pipeline/python
          pytest -v

  figma-plugin-check:
    # Figma 插件代码质量检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: figma-plugin/package-lock.json

      - name: Install figma-plugin dependencies
        run: |
          cd figma-plugin
          npm install

      - name: TypeScript type check
        run: |
          cd figma-plugin
          npm run type-check

      - name: Build code.ts → code.js
        run: |
          cd figma-plugin
          npm run build
          echo "=== Build result ==="
          ls -la code.js 2>/dev/null || echo "code.js not found (build may have output elsewhere)"
