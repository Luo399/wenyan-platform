name: CI Checks

# Node 版本单一来源：仓库根 .nvmrc（本文件与两个前端部署工作流都用
# node-version-file 读取，与 Dockerfile 的 node:22-slim 对齐）。
# 改版本只改 .nvmrc 一处。

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature-1
  push:
    branches:
      - 'trae/agent-*'
      - 'feature/**'
      - 'feature-1'
      # main 合并后也必须跑 CI，否则主干无门禁
      - 'main'
    paths:
      - 'src/**'
      - 'backend/**'
      - 'figma-plugin/**'
      - 'package.json'
      - 'eslint.config.ts'
      - '.oxlintrc.json'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/ci-checks.yml'

# CI 只读仓库内容
permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        # 门禁：lint 失败即失败，不再 continue-on-error。
        # 必须走 package.json 的 lint:ci（= oxlint . && eslint . --cache，都不带 --fix）：
        # 之前这里内联了一份等价命令，改 lint 参数要同时改两处，必然漂移。
        run: npm run lint:ci

      - name: Run frontend unit tests with coverage gate (vitest)
        # 2026-10-29：覆盖率门槛从「只在本机 npm run test:coverage 生效」挪进 CI。
        # 阈值在 vitest.config.ts 的 coverage.thresholds，不达标这一步直接非零退出；
        # provider 依赖 devDependencies 里的 @vitest/coverage-v8（vitest 4 已删 c8）。
        run: npm run test:coverage

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Check backend syntax
        run: |
          cd backend
          node -c server.js

      - name: Run backend database & API tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          JWT_SECRET: ci-test-secret
          AUTH_SECRET: ''

  circular-check:
    # 循环依赖检测：防止 barrel 文件导致的模块循环初始化
    # Vue SFC + TypeScript 均支持；发现循环依赖时 CI 失败
    #
    # 2026-10-30 换成仓库内的 scripts/check-circular.mjs，因为实测旧门禁根本不会红：
    #   1) 它装的 circular-dependency-scanner 没加 `-t`，而该工具默认「发现环也 exit 0」
    #      （夹具实测：不带 -t 退出码 0，带 -t 退出码 1），`||` 分支永远走不到；
    #   2) 它只读根 tsconfig.json 的 paths，本仓根 tsconfig.json 是
    #      `{files: [], references: [...]}`，别名 `@/*` 定义在 tsconfig.app.json，
    #      所以 src 的 300 条静态边里 262 条（87%）`@/` 引入对它是不透明的边。
    # 现在前端 src 与后端 backend/src 一起扫，后端此前没有任何环检查。
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Circular dependency scan
        # 检查器零依赖（只用 node 内置模块），不需要 npm install
        run: node scripts/check-circular.mjs src backend/src

  pipeline-test:
    # 数据管道（data-pipeline/python）Python 单元测试
    # 对应 docs/refactor/07-data-pipeline.md P01
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/python/pyproject.toml

      - name: Install pipeline package and test dependencies
        # 以可编辑模式安装 data-pipeline/python，同时安装 [test] 可选依赖（pytest）
        run: |
          pip install --upgrade pip
          pip install -e "data-pipeline/python[test]"

      - name: Run pytest
        run: |
          cd data-pipeline/python
          pytest -v

  figma-plugin-check:
    # Figma 插件代码质量检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: figma-plugin/package-lock.json

      - name: Install figma-plugin dependencies
        run: |
          cd figma-plugin
          npm install

      - name: TypeScript type check
        run: |
          cd figma-plugin
          npm run type-check

      - name: Build code.ts → code.js
        run: |
          cd figma-plugin
          npm run build
          echo "=== Build result ==="
          ls -la code.js 2>/dev/null || echo "code.js not found (build may have output elsewhere)"

      - name: Verify code.js is in sync with code.ts
        # code.js 是入库产物（Figma 直接加载它），必须与 code.ts 保持同步
        run: |
          cd figma-plugin
          if ! git diff --exit-code -- code.js; then
            echo "::error::code.js 与 code.ts 不同步：请本地运行 npm run build 并提交更新后的 figma-plugin/code.js"
            exit 1
          fi
          echo "✅ code.js 与 code.ts 同步"
